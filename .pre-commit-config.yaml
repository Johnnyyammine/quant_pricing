# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: prettier
        name: prettier
        entry: bash -c 'cd web && npx prettier --write --ignore-unknown "${@#web/}"' --
        language: system
        files: ^web/
